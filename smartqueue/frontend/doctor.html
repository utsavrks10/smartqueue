<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Doctor Dashboard - SmartQueue</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <nav>

        <div class="logo">
            SmartQueue
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="patient.html">
                Patient
            </a>

            <a href="doctor.html">
                Doctor
            </a>

        </div>

    </nav>


    <main class="container">

        <h1>Doctor Dashboard</h1>

        <p>
            Manage the OPD queue in real time.
        </p>


        <div class="doctor-grid">

            <div class="card">

                <p>Currently Serving</p>

                <h2 id="doctorCurrent">
                    A024
                </h2>

                <button
                    class="btn"
                    onclick="callNextPatient()"
                >
                    Call Next Patient
                </button>

            </div>


            <div class="card">

                <h2>Waiting Patients</h2>

                <div class="patient-row">
                    <span>A025</span>
                    <span>Waiting</span>
                </div>

                <div class="patient-row">
                    <span>A026</span>
                    <span>Waiting</span>
                </div>

                <div class="patient-row">
                    <span>A027</span>
                    <span>Waiting</span>
                </div>

            </div>


            <div class="card emergency-box">

                <h2>Emergency Handling</h2>

                <p>
                    Add an emergency patient and
                    recalculate the queue.
                </p>

                <button
                    class="emergency-btn"
                    onclick="handleEmergency()"
                >
                    🚨 Emergency
                </button>

            </div>

        </div>


        <div
            id="doctorMessage"
            class="message"
        ></div>

    </main>


    <script src="script.js"></script>

</body>

</html>
