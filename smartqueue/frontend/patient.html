<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient - SmartQueue</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <div class="logo">SmartQueue</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="patient.html">Patient</a>
            <a href="doctor.html">Doctor</a>
        </div>
    </nav>


    <main class="container">

        <div class="card">

            <h1>Patient Registration</h1>

            <p>
                Register for your OPD queue and receive your token.
            </p>

            <form id="patientForm">

                <label>Patient Name</label>

                <input
                    type="text"
                    id="patientName"
                    placeholder="Enter your name"
                    required
                >


                <label>Department</label>

                <select id="department">

                    <option value="General OPD">
                        General OPD
                    </option>

                    <option value="Medicine">
                        Medicine
                    </option>

                    <option value="Orthopedic">
                        Orthopedic
                    </option>

                    <option value="ENT">
                        ENT
                    </option>

                </select>


                <button type="submit" class="btn">
                    Get Token
                </button>

            </form>

        </div>


        <div
            id="tokenResult"
            class="card token-card hidden"
        >

            <h2>Your Token</h2>

            <div id="tokenNumber" class="token">
                A000
            </div>

            <p>
                Please keep this token number.
            </p>

            <a href="queue.html" class="btn">
                Track Queue
            </a>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
