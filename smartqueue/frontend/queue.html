<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Live Queue - SmartQueue</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav>

        <div class="logo">
            SmartQueue
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="patient.html">
                Patient
            </a>

            <a href="doctor.html">
                Doctor
            </a>

        </div>

    </nav>


    <main class="container">

        <div class="queue-header">

            <h1>Live OPD Queue</h1>

            <span class="live">
                ● LIVE
            </span>

        </div>


        <div class="queue-grid">

            <div class="card">

                <p>Your Token</p>

                <h2 id="yourToken">
                    A026
                </h2>

            </div>


            <div class="card">

                <p>Now Serving</p>

                <h2 id="currentToken">
                    A024
                </h2>

            </div>


            <div class="card">

                <p>People Ahead</p>

                <h2 id="peopleAhead">
                    1
                </h2>

            </div>


            <div class="card">

                <p>Estimated Wait</p>

                <h2>
                    <span id="estimatedWait">
                        8
                    </span>
                    min
                </h2>

            </div>

        </div>


        <div class="card status-card">

            <h2>Queue Status</h2>

            <p id="queueStatus">
                Your position is being monitored.
            </p>

        </div>


        <div class="card emergency-card">

            <h2>Queue Update</h2>

            <p>
                If an emergency case arrives,
                the queue may be automatically recalculated.
            </p>

        </div>

    </main>

</body>
</html>
